name: KeyPro CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Static Analysis & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: keypro_test
          POSTGRES_USER: keypro_user
          POSTGRES_PASSWORD: keypro_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, zip, bcmath, mbstring, intl, curl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Database Migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: keypro_test
          DB_USERNAME: keypro_user
          DB_PASSWORD: keypro_password
        run: php artisan migrate --force

      - name: Run PHP Artisan Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: keypro_test
          DB_USERNAME: keypro_user
          DB_PASSWORD: keypro_password
        run: php artisan test

  frontend-quality-and-build:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Code Quality
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npm run test

      - name: Build Production Assets with Vite
        run: npm run build
