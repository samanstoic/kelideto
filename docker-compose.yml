services:
  keypro-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keypro_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: ${APP_KEY:?Set APP_KEY in the .env file}
      INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:?Set INITIAL_SETUP_TOKEN in the .env file}
      DB_CONNECTION: pgsql
      DB_HOST: keypro-postgis
      DB_PORT: 5432
      DB_DATABASE: keypro_db
      DB_USERNAME: keypro_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      keypro-postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"file_get_contents('http://localhost:8000/api/health');\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  keypro-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keypro_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: ${APP_KEY:?Set APP_KEY in the .env file}
      INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:?Set INITIAL_SETUP_TOKEN in the .env file}
      DB_CONNECTION: pgsql
      DB_HOST: keypro-postgis
      DB_PORT: 5432
      DB_DATABASE: keypro_db
      DB_USERNAME: keypro_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    volumes:
      - .:/var/www/html
    depends_on:
      keypro-postgis:
        condition: service_healthy

  keypro-postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: keypro_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: keypro_db
      POSTGRES_USER: keypro_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keypro_user -d keypro_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keypro-redis:
    image: redis:7.2-alpine
    container_name: keypro_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgis_data:
    driver: local
  redis_data:
    driver: local
